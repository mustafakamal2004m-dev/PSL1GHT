name: Build PSL1GHT Samples

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ps3dev/ps3toolchain:latest
      options: --user root
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Samples
        run: |
          export PS3DEV=/usr/local/ps3dev
          export PSL1GHT=$PS3DEV
          export PATH=$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin
          cd samples
          make

      - name: Upload .self files
        uses: actions/upload-artifact@v4
        with:
          name: PS3-Samples
          path: samples/**/*.self
